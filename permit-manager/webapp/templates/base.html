<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Permit Desk{% endblock %}</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#697586; --line:#e3e8ee;
    --accent:#2d6cdf; --accent-ink:#fff;
    --ok:#12805c; --ok-bg:#e3f5ee; --warn:#9a6700; --warn-bg:#fdf3d7;
    --wait:#5b6472; --wait-bg:#eef1f5; --none:#8a94a3; --none-bg:#eef1f5;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  header .wrap{max-width:1000px;margin:0 auto;padding:14px 22px;display:flex;align-items:baseline;gap:14px}
  header h1{font-size:17px;margin:0;letter-spacing:.2px}
  header .crumb{color:var(--muted);font-size:14px}
  main{max-width:1000px;margin:0 auto;padding:26px 22px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:30px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-complete{color:var(--ok);background:var(--ok-bg)}
  .b-partially-signed{color:var(--warn);background:var(--warn-bg)}
  .b-filled{color:var(--wait);background:var(--wait-bg)}
  .b-not-started,.b-drafted{color:var(--none);background:var(--none-bg)}
  .b-sent{color:var(--warn);background:var(--warn-bg)}
  .b-signed,.b-received{color:var(--ok);background:var(--ok-bg)}
  .muted{color:var(--muted)}
  .btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
       padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500}
  .btn:hover{border-color:var(--accent);text-decoration:none}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text],input[type=email],select,textarea{
     font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  pre{background:#0f1622;color:#d6e0ee;padding:14px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.5}
  details summary{cursor:pointer;color:var(--muted);font-size:13px}
  .preview{max-width:100%;border:1px solid var(--line);border-radius:8px}
  .empty{color:var(--muted);padding:24px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <h1><a href="{{ url_for('dashboard') }}" style="color:inherit">🗂️ Permit Desk</a></h1>
  <span class="crumb">{% block crumb %}{% endblock %}</span>
</div></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
