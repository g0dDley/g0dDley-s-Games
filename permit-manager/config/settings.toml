# Permit-manager settings

[paths]
mappings = "mappings"
projects = "data/projects"
forms    = "forms/blank"

[fill]
# Low-confidence (AI-proposed) mappings are NOT written unless explicitly
# approved with `fill --approve-low`.
write_low_confidence = false
# Overlaid values are drawn in a subtle blue so filled data is visually
# distinguishable from the pre-printed form. Set to [0,0,0] for black.
text_color = [0.0, 0.0, 0.55]

[review]
preview_dpi = 130   # PNG preview resolution for overlay fills

[email]
# Outreach is drafted, never auto-sent.
auto_send = false
# Preferred platform for drafts. "outlook" -> deliver an Outlook-ready .eml
# (X-Unsent flag) to open, review, and send. Never use personal Gmail.
platform = "outlook"
# Never attach a blank/unsigned form to an outreach email. The signed form is
# attached manually by the user before sending.
attach_unsigned_form = false
